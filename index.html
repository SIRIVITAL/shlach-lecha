/* ======================= תחנה 5ב: הדים — מידה כנגד מידה ======================= */
function openEcho(onDone) {
  const P = S.pz('echo'); const solved = P.done;
  const pairs = P.pairs || {}; let sel = null;
  const hues = { h1: '#8c2f2f', h2: '#2f4f7a', h3: '#3d6b5a', h4: '#9a6a1f' };
  const body = h('div'); const fb = h('div', { 'aria-live': 'polite' });
  const order = ['h3', 'h1', 'h4', 'h2'];
  function render() {
    body.innerHTML = '';
    body.append(h('div', { class: 'note' }, PZ_ECHO.intro));
    const L = h('div', { class: 'echoCol' }, h('h5', {}, '🗣️ מה אמרו ועשו'));
    const R = h('div', { class: 'echoCol' }, h('h5', {}, '📜 הגזרה'));
    PZ_ECHO.said.forEach(s => {
      const pr = pairs[s.id]; const el = h('div', { class: 'echo' + (pr ? ' paired' : '') + (sel === s.id ? ' sel' : ''), tabindex: '0', role: 'button', style: pr ? { borderColor: hues[s.id], background: hues[s.id] + '18' } : {} }, h('div', { class: 'heb' }, s.text), h('div', { class: 'r' }, refLabel(s.ref)));
      el.onclick = () => { if (pr || solved) return; sel = sel === s.id ? null : s.id; render(); };
      L.append(el);
    });
    order.forEach(id => {
      const d = PZ_ECHO.decree.find(x => x.id === id); const pr = pairs[id];
      const el = h('div', { class: 'echo' + (pr ? ' paired' : ''), tabindex: '0', role: 'button', style: pr ? { borderColor: hues[id], background: hues[id] + '18' } : {} }, h('div', { class: 'heb' }, d.text), h('div', { class: 'r' }, refLabel(d.ref)));
      el.onclick = () => {
        if (pr || solved || !sel) return;
        if (sel === id) { pairs[id] = true; P.pairs = pairs; sel = null; save(); render(); setFB(fb, 'good', '✓ הד נמצא!'); if (Object.keys(pairs).length === PZ_ECHO.said.length) finish(); }
        else { shake(el); setFB(fb, 'bad', 'ההד הזה אינו מתאים לאמירה שבחרתן. חפשו מילים חוזרות.'); }
      };
      R.append(el);
    });
    body.append(h('div', { class: 'echoGrid' }, L, R), fb);
    if (solved || Object.keys(pairs).length === PZ_ECHO.said.length) body.append(h('div', { class: 'note' }, PZ_ECHO.note));
  }
  function finish() { S.completePz('echo', { pairs }); S.addEvidence('e_midda'); setFB(fb, 'good', '✓ כל ההדים נמצאו. "כַּאֲשֶׁר דִּבַּרְתֶּם בְּאָזְנָי כֵּן אֶעֱשֶׂה לָכֶם".'); onDone && onDone(); saveNow(); }
  render();
  const foot = [h('span', { class: 'sp' }), h('button', { class: 'btn ghost', onclick: () => closeModal() }, 'סגירה (העבודה נשמרת)')];
  if (G.teacher && !solved) foot.unshift(h('button', { class: 'btn red small', onclick: () => { PZ_ECHO.said.forEach(s => pairs[s.id] = true); P.pairs = pairs; render(); finish(); } }, 'מורה: פתרון'));
  openModal({ title: '🔔 הדים: מידה כנגד מידה', full: true, cls: 'desk', body: h('div', {}, h('p', {}, 'לחצו על אמירה מימין, ואז על ההד שלה בגזרה משמאל.'), body), foot });
}

/* ======================= סיום: לוח הראיות ======================= */
function openBoard(onDone) {
  const P = S.pz('board'); const solved = P.done;
  const place = P.place || {}; let tries = 0;
  const pool = h('div', { class: 'cardPool', 'data-id': 'pool', style: { marginBottom: '12px' } });
  const slotEls = {}; const board = h('div', { class: 'board' });
  PZ_BOARD.slots.forEach(s => { slotEls[s.id] = h('div', { class: 'slot' + (s.special ? ' special' : ''), 'data-id': String(s.id) }, h('span', { class: 'n' }, s.special ? '★' : s.id), h('h6', {}, s.label)); board.append(slotEls[s.id]); });
  const cardEls = {};
  PZ_BOARD.cards.forEach(c => { const ic = c.item ? ITEMS[c.item].icon : c.icon; cardEls[c.id] = h('div', { class: 'ecard', 'data-id': c.id }, h('span', { class: 'cat' }, ic + ' ראיה'), h('span', { class: 'heb', style: { fontSize: '1rem' } }, c.text), h('span', { class: 'r' }, c.ref)); });
  const layout = () => Object.entries(cardEls).forEach(([id, el]) => { el.classList.remove('bad', 'ok'); const s = place[id]; if (s && slotEls[s]) { const ex = [...slotEls[s].querySelectorAll('.ecard')].filter(x => x !== el); ex.forEach(x => { delete place[x.dataset.id]; pool.append(x); }); slotEls[s].append(el); } else pool.append(el); });
  layout();
  if (!solved) makeSelectable(() => Object.values(cardEls), () => [...Object.values(slotEls), pool], (cid, tid) => { if (tid === 'pool') delete place[cid]; else place[cid] = tid; P.place = place; save(); layout(); });
  const F = puzzleFoot({ solved, hints: PZ_BOARD.hints,
    onCheck: () => {
      const need = PZ_BOARD.cards.filter(c => c.slot);
      if (need.some(c => !place[c.id]) || PZ_BOARD.slots.some(s => !Object.values(place).includes(String(s.id)))) return setFB(F.fb, 'info', 'מלאו את כל ששת המקומות בלוח.');
      const wrong = PZ_BOARD.cards.filter(c => (c.slot ? String(c.slot) : undefined) !== place[c.id] && !(c.decoy && !place[c.id])); tries++;
      if (!wrong.length) { setFB(F.fb, 'good', '✓ שרשרת הראיות שלמה! עכשיו אפשר לכתוב את פתרון התעלומה.'); Object.values(cardEls).forEach(e => e.classList.add('ok')); S.completePz('board', { place }); F.check.disabled = true; F.check.textContent = '✓ נפתר'; onDone && onDone(); }
      else { setFB(F.fb, 'bad', `${wrong.length} ראיות אינן במקומן.${tries >= 2 ? ' הן מסומנות.' : ''}`); if (tries >= 2) wrong.forEach(c => cardEls[c.id].classList.add('bad')); }
      saveNow();
    },
    onTeacher: () => { PZ_BOARD.cards.forEach(c => { if (c.slot) place[c.id] = String(c.slot); else delete place[c.id]; }); layout(); F.check.click(); }
  });
  openModal({ title: '📌 לוח הראיות', full: true, cls: 'desk board-desk', body: h('div', {}, h('p', {}, 'סדרו את הראיות שאספתן לאורך המסע לפי שרשרת האירועים של המשלחת הקודמת. מקום ★ שמור למסקנה עבור השליחות שלכן. ראיה אחת אינה שייכת ללוח.'), pool, board, F.hintBox, F.fb), foot: F.foot });
}

/* =====================================================================
   סיכום ללימוד: בנייה מתוך העבודה השמורה → DOCX (Word) / HTML
   ===================================================================== */
function buildSummaryModel() {
  const st = G.st; const sections = [];
  TOPICS.forEach(t => {
    const sec = { n: t.n, title: t.title, refs: t.refs, facts: [], comms: [], answers: [], status: '' };
    const reached = t.station ? !!st.unlocked[t.station] : true;
    t.evidence.forEach(id => { if (st.evidence.includes(id)) { const e = EVIDENCE[id]; sec.facts.push({ title: e.title, text: e.text, refs: e.refs ? compactRefs(e.refs) : '' }); } });
    if (t.commentaryGroup) {
      COMM_GROUPS[t.commentaryGroup].forEach(c => {
        const q = Object.keys(QUESTIONS).find(k => QUESTIONS[k].commentary === c);
        if (S.commDone(c) || S.ans(q).trim()) { const C = COMMENTARIES[c]; sec.comms.push({ name: C.name, title: C.title, theme: C.theme, source: C.source, text: C.text, done: S.commDone(c), q: QUESTIONS[q].text, a: S.ans(q) }); }
      });
    }
    t.questions.forEach(q => {
      const Q = QUESTIONS[q];
      if (Q.bonus) { if (S.ans(q).trim()) sec.answers.push({ q: Q.text, a: S.ans(q), bonus: BONUSES[Q.bonus].title, src: bonusSource(Q.bonus) }); }
      else if (Q.required) sec.answers.push({ q: Q.text, a: S.ans(q) });
    });
    if (t.n === 10) {
      const extra = []; ['s3', 'final'].forEach(g => { const d = S.groupDone(g); if (d.length > 1) extra.push(`פרשנויות נוספות שהושלמו (${g === 's3' ? 'פרק 4' : 'פרק 8'}): ` + d.map(c => COMMENTARIES[c].name).join(', ')); });
      sec.extra = extra;
    }
    sec.status = !reached ? 'טרם הגעתן לחלק הזה במשחק.' : '';
    sections.push(sec);
  });
  return { name: st.studentName, date: new Date().toLocaleDateString('he-IL'), sections };
}
function bonusSource(b) { const B = BONUSES[b]; if (B.commentary) { const C = COMMENTARIES[B.commentary]; return `${C.name}${C.title ? ' — ' + C.title : ''}`; } if (B.refs) return B.refs.map(refLabel).join('; '); return ''; }
function compactRefs(refs) { if (refs.length > 2 && contiguous(refs)) return rangeLabel(refs[0], refs[refs.length - 1]); return refs.map(refLabel).join('; '); }

const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

const X = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');

  return String(text).split('\n').map((line, i) => `${i ? '<w:r><w:br/></w:r>' : ''}<w:r>${rpr}<w:t xml:space="preserve">${X(line)}</w:t></w:r>`).join('');
}
function wP(runs, style, o = {}) { return `<w:p><w:pPr>${style ? `<w:pStyle w:val="${style}"/>` : ''}${o.num ? '<w:numPr><w:ilvl w:val="0"/><w:numId w:val="1"/></w:numPr>' : ''}<w:bidi/></w:pPr>${runs}</w:p>`; }
function docxBody(M) {
  let b = '';
  b += wP(wRun('סיכום ללימוד: פרשת "שלח לך" — במדבר י״ג–י״ד'), 'Title');
  b += wP(wRun(`${M.name ? 'שם: ' + M.name + '   ·   ' : ''}תאריך: ${M.date}`), 'Subtitle');
  b += wP(wRun('נבנה מתוך העבודה במשחק "שלח לך: תעלומת המשלחת האבודה". פסקאות על רקע בהיר = מידע ומקורות; פסקאות במסגרת כחולה = התשובות שלי, במילים שלי. אפשר לערוך, לתקן ולהוסיף בחופשיות.', { i: true, color: '666666', sz: 20 }));
  M.sections.forEach(s => {
    b += wP(wRun(`${s.n}. ${s.title}`), 'Heading1');
    if (s.refs) b += wP(wRun('מראי מקום: ', { b: true }) + wRun(s.refs), 'Refs');
    if (s.status) b += wP(wRun(s.status, { i: true, color: '888888' }));
    if (s.facts.length) { b += wP(wRun('מה גילינו'), 'Heading2'); s.facts.forEach(f => b += wP(wRun(f.title + ': ', { b: true }) + wRun(f.text) + (f.refs ? wRun(` (${f.refs})`, { color: '8A5A2B' }) : ''), 'Fact', { num: true })); }
    s.comms.forEach(c => {
      b += wP(wRun(`פרשנות: ${c.name}${c.title ? ' — ' + c.title : ''}`), 'Heading2');
      b += wP(wRun(`${c.theme} · ${c.source}`, { i: true, color: '888888', sz: 20 }));
      b += wP(wRun(c.text), 'Source');
      b += wP(wRun('שאלה: ', { b: true }) + wRun(c.q), 'QuestionP');
      b += wP(wRun('התשובה שלי: ', { b: true }) + (c.a.trim() ? wRun(c.a) : wRun('[טרם נכתבה תשובה]', { i: true })), 'Answer');
    });
    if ((s.n === 4 || s.n === 8) && !s.comms.length) b += wP(wRun('טרם הושלמה פרשנות.', { i: true, color: '888888' }));
    s.answers.forEach(a => {
      if (a.bonus) b += wP(wRun(`⭐ בונוס: ${a.bonus}` + (a.src ? ` (${a.src})` : '')), 'Heading2');
      b += wP(wRun('שאלה: ', { b: true }) + wRun(a.q), 'QuestionP');
      b += wP(wRun('התשובה שלי: ', { b: true }) + (a.a.trim() ? wRun(a.a) : wRun('[טרם נכתבה תשובה]', { i: true })), 'Answer');
    });
    if (s.n === 10) { (s.extra || []).forEach(x => b += wP(wRun(x))); if (!s.answers.length && !(s.extra || []).length) b += wP(wRun('עדיין לא הושלמו בונוסים.', { i: true, color: '888888' })); }
  });

}

${sty('Title', 'Title', '<w:spacing w:after="80"/>', '<w:b/><w:bCs/><w:color w:val="4A2E18"/><w:sz w:val="40"/><w:szCs w:val="44"/>')}
${sty('Subtitle', 'Subtitle', '<w:spacing w:after="200"/>', '<w:color w:val="8A5A2B"/><w:sz w:val="22"/><w:szCs w:val="24"/>')}

function boot() {
  G.storageOK = testStorage();
  G.st = loadLocal() || defaultState();
  buildShell();
  if (G.teacher) document.body.append(h('div', { id: 'teacherBanner' }, 'מצב מורה — שמירה נפרדת · לחיצה משולשת על הלוגו ליציאה'));
  if (G.st.started) {
    // שחזור אוטומטי: מי שכבר התחילה ממשיכה ישר מאותה נקודה
    renderScene(STATION_DEFS[G.st.location]); refreshUI();
    G.lastSaved = new Date(G.st.savedAt || Date.now()); updateSaveInd(G.storageOK);
    setTimeout(() => toast(`✓ ברוכה השבה${G.st.studentName ? ', ' + G.st.studentName : ''}! ההתקדמות שלך שוחזרה.`, 3200), 300);
    if (!G.storageOK) saveNow();
    return;
  }
  titleScreen();
}
function titleScreen() {
  const name = h('input', { type: 'text', class: 'txtIn', placeholder: 'השם שלך (יופיע בתיק החקירה ובסיכום)', value: G.st.studentName || '', 'aria-label': 'שם' });
  const start = () => {
    G.st.studentName = name.value.trim() || G.st.studentName; G.st.started = true; saveNow(); scr.remove();
    goTo(G.st.location);
  };
  const card = h('div', { class: 'tcard' },
    h('div', { class: 'kicker' }, 'חדר בריחה בתנ״ך · במדבר י״ג–י״ד'),
    h('h1', {}, 'שלח לך', h('span', {}, 'תעלומת המשלחת האבודה')),
    h('p', { style: { margin: '14px 0 6px', lineHeight: 1.6 } }, 'אתן שני המרגלים שיהושע שולח מן השיטים אל יריחו. בדרך תגלו מה קרה למשלחת אחרת שנשלחה לארץ לפני ארבעים שנה — ולמה רק שניים מאנשיה שרדו.'),
    name,
    !G.storageOK ? h('div', { class: 'feedback bad', style: { textAlign: 'start', fontSize: '.9rem' } }, '⚠ בדפדפן הזה לא ניתן לשמור התקדמות אוטומטית (אולי זו גלישה בסתר). אפשר לשחק, אבל זכרו לשלוח לעצמכן את ההתקדמות למייל (💾) בסוף כל שיעור.') : null,
    h('div', { class: 'row' },
      h('button', { class: 'btn gold', style: { fontSize: '1.15rem', padding: '11px 26px' }, onclick: start }, '▶ התחלת המסע')),
    h('div', { class: 'row' },
      h('button', { class: 'btn', onclick: () => pickBackupFile() }, '📂 המשך משחק משמירה'),
      h('button', { class: 'btn ghost small', onclick: () => openSaveMenu() }, 'טעינה מקוד שמירה')),
    h('p', { class: 'fic', style: { marginTop: '10px' } }, 'כבר התחלתן במכשיר אחר? הקישו "המשך משחק משמירה" ובחרו את קובץ הגיבוי ששלחתן לעצמכן במייל.'));
